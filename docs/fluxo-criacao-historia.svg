<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1280" viewBox="0 0 1600 1280" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo de criação de histórias em quadrinhos</title>
  <desc id="desc">Fluxo desde o pedido do usuário até a consulta ao GitHub, leitura da história e das regras, consulta das skills, geração e validação da imagem e atualização opcional do rastreio.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A1628"/><stop offset="1" stop-color="#152943"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C4A031"/><stop offset="1" stop-color="#E2C66B"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity=".22"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11 Z" fill="#C4A031"/></marker>
    <style>
      .heading{font:700 38px Arial,Helvetica,sans-serif;fill:#fff}.sub{font:400 19px Arial,Helvetica,sans-serif;fill:#BFCBDD}
      .num{font:700 18px Arial,sans-serif;fill:#0A1628}.box-title{font:700 23px Arial,sans-serif;fill:#fff}
      .body{font:400 18px Arial,sans-serif;fill:#DCE5F1}.small{font:400 16px Arial,sans-serif;fill:#BFCBDD}
      .step{fill:#1A304B;stroke:#36516F;stroke-width:2}.optional{fill:#172B41;stroke:#C4A031;stroke-width:2;stroke-dasharray:9 7}
      .line{fill:none;stroke:#C4A031;stroke-width:4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="1280" rx="28" fill="url(#bg)"/>
  <circle cx="1450" cy="100" r="180" fill="#C4A031" opacity=".06"/><circle cx="120" cy="1120" r="230" fill="#6E8BAE" opacity=".06"/>
  <rect x="70" y="56" width="1460" height="1168" rx="28" fill="none" stroke="#526780" stroke-opacity=".5"/>
  <text x="110" y="125" class="heading">Criação de histórias em quadrinhos</text>
  <text x="110" y="165" class="sub">Fluxo universal · ChatGPT ou agente · fontes e regras atuais do repositório</text>
  <rect x="110" y="210" width="1380" height="112" rx="18" class="step" filter="url(#shadow)"/>
  <circle cx="155" cy="266" r="23" fill="url(#gold)"/><text x="155" y="273" text-anchor="middle" class="num">1</text>
  <text x="195" y="254" class="box-title">Pedido do usuário</text>
  <text x="195" y="286" class="body">“Gere a imagem da história” · título/número · coleção ou roteiro, se necessário</text>
  <path d="M800 322 V360" class="line"/>
  <rect x="110" y="370" width="1380" height="112" rx="18" class="step" filter="url(#shadow)"/>
  <circle cx="155" cy="426" r="23" fill="url(#gold)"/><text x="155" y="433" text-anchor="middle" class="num">2</text>
  <text x="195" y="414" class="box-title">Consultar o GitHub antes de produzir</text>
  <text x="195" y="446" class="body">ROUTER-MESTRE.md → catálogo → template adequado → fonte narrativa real em historias/</text>
  <path d="M800 482 V520" class="line"/>
  <rect x="110" y="530" width="1380" height="112" rx="18" class="step" filter="url(#shadow)"/>
  <circle cx="155" cy="586" r="23" fill="url(#gold)"/><text x="155" y="593" text-anchor="middle" class="num">3</text>
  <text x="195" y="574" class="box-title">Ler contexto e regras atuais</text>
  <text x="195" y="606" class="body">Preservar fatos, personagens e sequência · regras visuais · validação · português brasileiro</text>
  <path d="M800 642 V680" class="line"/>
  <rect x="110" y="690" width="1380" height="112" rx="18" class="step" filter="url(#shadow)"/>
  <circle cx="155" cy="746" r="23" fill="url(#gold)"/><text x="155" y="753" text-anchor="middle" class="num">4</text>
  <text x="195" y="734" class="box-title">Consultar skills e verificar a ferramenta</text>
  <text x="195" y="766" class="body">Higgsfield Generate como rota principal · recursos GPT Image 2 como complemento</text>
  <path d="M800 802 V840" class="line"/>
  <rect x="110" y="850" width="1380" height="112" rx="18" class="step" filter="url(#shadow)"/>
  <circle cx="155" cy="906" r="23" fill="url(#gold)"/><text x="155" y="913" text-anchor="middle" class="num">5</text>
  <text x="195" y="894" class="box-title">Gerar uma imagem e validar</text>
  <text x="195" y="926" class="body">Padrão 16:9 · Full HD mínimo · conferir história, quadros, balões, texto e legibilidade</text>
  <path d="M800 962 V1000" class="line"/>
  <rect x="110" y="1010" width="1380" height="112" rx="18" class="optional" filter="url(#shadow)"/>
  <circle cx="155" cy="1066" r="23" fill="url(#gold)"/><text x="155" y="1073" text-anchor="middle" class="num">6</text>
  <text x="195" y="1054" class="box-title">Registrar o estado real (quando aplicável)</text>
  <text x="195" y="1086" class="body">Atualizar o manifesto se o status mudou e houver acesso autorizado · cópia individual do roteiro é opcional</text>
  <text x="110" y="1175" class="small">Se a fonte estiver ausente ou ambígua, pedir esclarecimento. Nunca inventar contexto, execução, arquivo salvo ou status.</text>
</svg>