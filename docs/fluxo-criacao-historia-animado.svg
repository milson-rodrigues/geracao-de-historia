<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1280" viewBox="0 0 1600 1280" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo de criação de histórias em quadrinhos</title>
  <desc id="desc">Fluxo desde o pedido do usuário até a consulta ao GitHub, leitura da história e das regras, consulta das skills, geração e validação da imagem e atualização opcional do rastreio.</desc>
  <defs>
    <style>
      .stage-box { animation: appear 7.2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      .stage-box.s1 { animation-delay: 0s; }
      .stage-box.s2 { animation-delay: .35s; }
      .stage-box.s3 { animation-delay: .7s; }
      .stage-box.s4 { animation-delay: 1.05s; }
      .stage-box.s5 { animation-delay: 1.4s; }
      .stage-box.s6 { animation-delay: 1.75s; }
      .flow-line { stroke-dasharray: 14 10; animation: flow 1.8s linear infinite; }
      .step-number { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .step-number.n2 { animation-delay: .25s; }
      .step-number.n3 { animation-delay: .5s; }
      .step-number.n4 { animation-delay: .75s; }
      .step-number.n5 { animation-delay: 1s; }
      .step-number.n6 { animation-delay: 1.25s; }
      @keyframes appear {
        0% { opacity: .48; }
        12%, 82% { opacity: 1; }
        96%, 100% { opacity: .48; }
      }
      @keyframes flow { to { stroke-dashoffset: -48; } }
      @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
      @media (prefers-reduced-motion: reduce) {
        .stage-box, .flow-line, .step-number { animation: none !important; }
      }
    </style>
  </defs>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C4A031"/><stop offset="1" stop-color="#E2C66B"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11 Z" fill="#C4A031"/></marker>
    <style>
      .heading{font:700 38px Arial,Helvetica,sans-serif;fill:#172033}.sub{font:400 19px Arial,Helvetica,sans-serif;fill:#46556B}
      .num{font:700 18px Arial,sans-serif;fill:#172033}.box-title{font:700 23px Arial,sans-serif;fill:#172033}
      .body{font:400 18px Arial,sans-serif;fill:#344256}.small{font:400 16px Arial,sans-serif;fill:#46556B}
      .step{fill:#F4F6F9;stroke:#AAB6C5;stroke-width:2}.optional{fill:#FFF9E8;stroke:#B18B18;stroke-width:2;stroke-dasharray:9 7}
      .line{fill:none;stroke:#B18B18;stroke-width:4;marker-end:url(#arrow)}
      @media (prefers-color-scheme: dark) {
        .heading{fill:#fff}.sub{fill:#BFCBDD}.num{fill:#0A1628}.box-title{fill:#fff}
        .body{fill:#DCE5F1}.small{fill:#BFCBDD}
        .step{fill:#1A304B;stroke:#526780}.optional{fill:#172B41;stroke:#C4A031}
        .line{stroke:#C4A031}
      }
    </style>
  </defs>
  <text x="110" y="125" class="heading">Criação de histórias em quadrinhos</text>
  <text x="110" y="165" class="sub">Fluxo universal · ChatGPT ou agente · fontes e regras atuais do repositório</text>
  <rect x="110" y="210" width="1380" height="112" rx="18" class="step stage-box s1"/>
  <circle cx="155" cy="266" r="23" fill="url(#gold)" class="step-number n1"/><text x="155" y="273" text-anchor="middle" class="num">1</text>
  <text x="195" y="254" class="box-title">Pedido do usuário</text>
  <text x="195" y="286" class="body">“Gere a imagem da história” · título/número · coleção ou roteiro, se necessário</text>
  <path d="M800 322 V360" class="line flow-line"/>
  <rect x="110" y="370" width="1380" height="112" rx="18" class="step stage-box s2"/>
  <circle cx="155" cy="426" r="23" fill="url(#gold)" class="step-number n2"/><text x="155" y="433" text-anchor="middle" class="num">2</text>
  <text x="195" y="414" class="box-title">Consultar o GitHub antes de produzir</text>
  <text x="195" y="446" class="body">ROUTER-MESTRE.md → catálogo → template adequado → fonte narrativa real em historias/</text>
  <path d="M800 482 V520" class="line flow-line"/>
  <rect x="110" y="530" width="1380" height="112" rx="18" class="step stage-box s3"/>
  <circle cx="155" cy="586" r="23" fill="url(#gold)" class="step-number n3"/><text x="155" y="593" text-anchor="middle" class="num">3</text>
  <text x="195" y="574" class="box-title">Ler contexto e regras atuais</text>
  <text x="195" y="606" class="body">Preservar fatos, personagens e sequência · regras visuais · validação · português brasileiro</text>
  <path d="M800 642 V680" class="line flow-line"/>
  <rect x="110" y="690" width="1380" height="112" rx="18" class="step stage-box s4"/>
  <circle cx="155" cy="746" r="23" fill="url(#gold)" class="step-number n4"/><text x="155" y="753" text-anchor="middle" class="num">4</text>
  <text x="195" y="734" class="box-title">Consultar skills e verificar a ferramenta</text>
  <text x="195" y="766" class="body">Higgsfield Generate como rota principal · recursos GPT Image 2 como complemento</text>
  <path d="M800 802 V840" class="line flow-line"/>
  <rect x="110" y="850" width="1380" height="112" rx="18" class="step stage-box s5"/>
  <circle cx="155" cy="906" r="23" fill="url(#gold)" class="step-number n5"/><text x="155" y="913" text-anchor="middle" class="num">5</text>
  <text x="195" y="894" class="box-title">Gerar uma imagem e validar</text>
  <text x="195" y="926" class="body">Padrão 16:9 · Full HD mínimo · conferir história, quadros, balões, texto e legibilidade</text>
  <path d="M800 962 V1000" class="line flow-line"/>
  <rect x="110" y="1010" width="1380" height="112" rx="18" class="optional stage-box s6"/>
  <circle cx="155" cy="1066" r="23" fill="url(#gold)" class="step-number n6"/><text x="155" y="1073" text-anchor="middle" class="num">6</text>
  <text x="195" y="1054" class="box-title">Registrar o estado real (quando aplicável)</text>
  <text x="195" y="1086" class="body">Atualizar o manifesto se o status mudou e houver acesso autorizado · cópia individual do roteiro é opcional</text>
  <text x="110" y="1175" class="small">Se a fonte estiver ausente ou ambígua, pedir esclarecimento. Nunca inventar contexto, execução, arquivo salvo ou status.</text>
</svg>